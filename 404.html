<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Kule Solution</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#324A79">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; background: var(--navy-900); padding: 40px 24px; }
  .nf__code { font-size: clamp(4.5rem, 16vw, 9rem); font-weight: 900; color: var(--yellow); line-height: 1; letter-spacing: -.04em; }
  .nf h1 { color: #fff; font-size: clamp(1.4rem, 3.4vw, 2.1rem); margin: 14px 0 16px; }
  .nf p { color: rgba(255,255,255,.72); max-width: 460px; margin: 0 auto 32px; }
  .nf img { height: 44px; width: auto; margin: 0 auto 40px; }
  .nf .btn-row { justify-content: center; }
</style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/assets/img/logo-white.png" alt="Kule Solution">
      <div class="nf__code">404</div>
      <h1 id="t">Faqja nuk u gjet</h1>
      <p id="d">Kjo faqe nuk ekziston ose është zhvendosur. Kthehuni në ballinë ose na kontaktoni.</p>
      <div class="btn-row">
        <a class="btn btn--accent" href="/" id="b1">Ballina</a>
        <a class="btn btn--onDark" href="/contact.html" id="b2">Kontakt</a>
      </div>
    </div>
  </main>

<script>
(function () {
  var L = {
    sq: { t: "Faqja nuk u gjet", d: "Kjo faqe nuk ekziston ose është zhvendosur. Kthehuni në ballinë ose na kontaktoni.", b1: "Ballina", b2: "Kontakt" },
    en: { t: "Page not found",   d: "This page does not exist or has been moved. Go back to the home page or get in touch.", b1: "Home",    b2: "Contact" },
    tr: { t: "Sayfa bulunamadı",  d: "Bu sayfa mevcut değil ya da taşınmış. Ana sayfaya dönün veya bize ulaşın.",             b1: "Ana Sayfa", b2: "İletişim" }
  };
  var lang = "sq";
  try { lang = localStorage.getItem("kule-lang") || "sq"; } catch (e) {}
  var q = new URLSearchParams(location.search).get("lang");
  if (q) lang = q;
  var s = L[lang] || L.sq;
  document.documentElement.lang = lang;
  document.getElementById("t").textContent  = s.t;
  document.getElementById("d").textContent  = s.d;
  document.getElementById("b1").textContent = s.b1;
  document.getElementById("b2").textContent = s.b2;
})();
</script>
</body>
</html>
